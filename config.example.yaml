# Copy to config.yaml beside HRS.exe (or main.py) and fill in. config.yaml is
# gitignored; never commit it. Every setting below is required. A missing or
# placeholder value stops the run at startup, before Chrome opens.
#
# No passwords or secrets go in this file. Run HRS with --setup once per
# computer, signed in as the Windows account that will run it, and it stores
# the CCIS login and the Graph client secret in Windows Credential Manager.

ccis:
  # The CCIS sign-in page.
  url: "https://ccis.example.com"

  # true runs Chrome with no window. The window is fixed at 1920x1080 in that
  # mode, because the PDF is rendered from the page and a narrower viewport
  # changes what it looks like. false is the safer default: CCIS has been
  # finicky headless. With false, a scheduled task must run "only when user
  # is logged on" so Chrome has a screen; a locked screen is fine. Override
  # for one run with --headless or --no-headless.
  headless: false

  # Seconds. Carried over from Rap-Sheet and venire, where they are proven.
  wait_timeout: 5
  # Short on purpose: how long to wait for the "No matches found." banner.
  # Most people with a record never show it, so a long value here is added
  # to every one of them.
  no_results_wait_timeout: 1
  pause_between_actions: 1

  # Optional. Every element locator has a working default in ccis.py.
  # Override one only when a CCIS release renames a field.
  #
  # locators:
  #   last_name_field: "search_tab:personForm:lastname"

graph:
  # The Microsoft Graph app registration, shared with PROJECT-DALYN.
  # Identifiers only: the client secret is stored by --setup.
  tenant_id: "PASTE-TENANT-ID"
  client_id: "PASTE-CLIENT-ID"

  # The mailbox HRS reads the daily booking email from. It must receive its
  # own copy of the email, for example as a member of the distribution group;
  # a group itself has no mailbox to read. Only its Inbox is read, and the
  # email is never marked read or moved.
  mailbox: "mailbox@example.com"

  # The booking email is the one received today in that Inbox from this
  # sender, with this phrase somewhere in its subject (case ignored). Exactly
  # one such email with exactly one .xlsx attached is required; anything
  # else stops the run.
  sender: "sender@example.com"
  subject_contains: "PASTE-SUBJECT-PHRASE"

  # When today's email is not there yet, check again every few minutes until
  # this time, then stop. Only email received today counts. A 24-hour time
  # in quotes: unquoted, YAML reads a time like 10:30 as a number. Keep
  # these matching install_task.ps1's -Until and -EveryMinutes.
  check_until: "08:00"
  check_every_minutes: 10

paths:
  # The folder that holds one folder per day (mm.dd.yyyy), each with
  # Affidavit, CCIS, PTR and VIC inside. PDFs go into CCIS. Relative to the
  # folder HRS runs from unless absolute. It must already exist; HRS stops rather
  # than create it, so a disconnected drive is caught. Use "test" (gitignored)
  # for trial runs, and the network folder for real ones. A UNC path
  # (\\server\share\...) keeps working when Task Scheduler runs HRS without
  # your mapped drive letters. Put a Windows path in single quotes, as in
  # 'G:\Folder'; double quotes treat each backslash as an escape.
  hearings_root: "test"
  logs: "logs"
  # chromedriver.exe matching your Chrome. Leave "" to let Selenium find one,
  # or webdriver-manager download one.
  chromedriver: ""